<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>실시간 자막 시스템 대시보드</title>
<style>
  :root { --bd:#e3e6ea; --mut:#6b7280; }
  * { box-sizing: border-box; }
  body { font-family: Pretendard, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         margin:0; padding:2rem 1rem; background:#f0f2f5; color:#111; }
  .container { max-width:860px; margin:0 auto; background:#fff; padding:2rem;
               border-radius:10px; box-shadow:0 2px 12px rgba(0,0,0,.08); }
  h1 { text-align:center; margin:0 0 .5rem; font-size:1.5rem; }
  .net { text-align:center; color:var(--mut); font-size:.85rem; margin-bottom:2rem; line-height:1.7; }
  .net code { background:#f3f4f6; padding:.15rem .4rem; border-radius:4px; font-size:.85rem; user-select:all; }
  .lang-section { margin-bottom:1.5rem; }
  .lang-title { font-size:1.05rem; font-weight:700; margin-bottom:.75rem; padding-bottom:.5rem;
                border-bottom:2px solid #eee; display:flex; align-items:center; gap:.5rem; }
  .badge { font-size:.7rem; font-weight:600; color:var(--mut); background:#f3f4f6;
           border:1px solid var(--bd); border-radius:999px; padding:.1rem .5rem; }
  .btn-group { display:flex; gap:.75rem; flex-wrap:wrap; }
  .btn { flex:1 1 220px; padding:.9rem; text-align:center; text-decoration:none;
         border-radius:6px; font-weight:700; color:#fff; transition:opacity .15s; }
  .btn:hover { opacity:.88; }
  .btn-broadcast { background:#10b981; }
  .btn-typist { background:#3b82f6; }
  .name-row { display:flex; align-items:center; gap:.6rem; justify-content:center;
              margin-bottom:1.75rem; font-size:.9rem; color:var(--mut); }
  .name-row input { padding:.45rem .7rem; border:1px solid var(--bd); border-radius:6px;
                    font-size:.9rem; width:180px; font-family:inherit; }
</style>
</head>
<body>
<div class="container">
  <h1>🎙️ 실시간 자막 대시보드</h1>
  <div class="net" id="net">서버 정보 확인 중…</div>
  <div class="name-row">
    <label for="who">내 이름(속기사 식별용)</label>
    <input id="who" placeholder="예: 속기1" autocomplete="off">
  </div>
  <div id="channels">채널 정보를 불러오는 중입니다…</div>
</div>

<script>
const NAME_KEY = 'sub.typist.name';
const who = document.getElementById('who');
who.value = localStorage.getItem(NAME_KEY) || '';
who.addEventListener('input', () => {
  localStorage.setItem(NAME_KEY, who.value.trim());
  render(window.__cfg);
});

function render(cfg) {
  if (!cfg) return;
  const name = (localStorage.getItem(NAME_KEY) || '').trim();
  const q = (lang, extra) => `?lang=${encodeURIComponent(lang)}` + (extra || '');
  const nameQ = name ? `&name=${encodeURIComponent(name)}` : '';
  const box = document.getElementById('channels');
  box.innerHTML = '';
  cfg.languages.forEach(lang => {
    const s = document.createElement('div');
    s.className = 'lang-section';
    s.innerHTML = `
      <div class="lang-title">${lang.name} 채널 <span class="badge">${lang.code}</span></div>
      <div class="btn-group">
        <a class="btn btn-typist" target="_blank" href="/typist${q(lang.code, nameQ)}">⌨️ 타이피스트 (입력)</a>
        <a class="btn btn-broadcast" target="_blank" href="/broadcast${q(lang.code)}">📺 송출용 화면 (크로마키)</a>
      </div>`;
    box.appendChild(s);
  });
}

fetch('/api/config')
  .then(r => r.json())
  .then(cfg => {
    window.__cfg = cfg;
    document.getElementById('net').innerHTML =
      `이 페이지 주소를 다른 PC에 그대로 입력하세요 → <code>${location.origin}</code><br>` +
      `송출 화면을 연 뒤 우상단 <b>⚙</b> → 설정을 맞추고 <b>URL 복사</b> → Kiswe Studio에 붙여넣으세요.`;
    render(cfg);
  })
  .catch(() => {
    document.getElementById('channels').textContent = '설정을 불러오지 못했습니다. 서버 콘솔을 확인하세요.';
  });
</script>
</body>
</html>
