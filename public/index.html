<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>prj-livesub — 오퍼레이션 콘솔</title>
<link rel="stylesheet" href="/common/auth.css">
<style>
  :root{
    --bg:#f3f6fa; --panel:#ffffff; --panel2:#f7f9fc; --sunk:#eef1f6;
    --line:#e2e7ef; --line2:#d1d9e5;
    --fg:#131924; --fg2:#4c5869; --mut:#7d8899;

    --ok:#1f9c5d; --bad:#c5333a; --live:#d4453f; --steel:#2f6fb5;

    /* one hue per channel, dark enough to read on paper-white */
    --c-ko:#2f6fb5; --c-en:#1f8a6d; --c-ja:#a3701f; --c-zh:#7a55a8; --c-xx:#6b7687;

    --mono:ui-monospace,SFMono-Regular,Menlo,"Roboto Mono",monospace;
    --shadow:0 1px 2px rgba(19,25,36,.05);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--fg);
    font-family:Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    font-size:13px;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;
  }

  /* ---------- system bar ---------- */
  .sysbar{
    flex:0 0 auto;display:flex;align-items:center;gap:1rem;height:48px;padding:0 1.1rem;
    background:var(--panel);border-bottom:1px solid var(--line);
  }
  .sysbar-l,.sysbar-r{display:flex;align-items:center;gap:.8rem;min-width:0}
  .sysbar-r{margin-left:auto}
  .brandlogo{height:11px;width:auto;opacity:.62}
  .vr{width:1px;height:15px;background:var(--line2);flex:0 0 auto}
  .wordmark{font-family:var(--mono);font-size:11px;letter-spacing:.11em;color:var(--fg2)}
  .adminmark{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--mut);border:1px solid var(--line2);border-radius:3px;padding:.12rem .36rem}

  .health{display:flex;align-items:center;gap:.9rem}
  .hx{display:flex;align-items:baseline;gap:.38rem;font-family:var(--mono);font-size:10.5px;white-space:nowrap}
  .hx em{font-style:normal;color:var(--mut);letter-spacing:.11em;text-transform:uppercase;font-size:9.5px}
  .hx b{font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--mut);flex:0 0 auto;position:relative;top:-1px}
  .dot.ok{background:var(--ok);box-shadow:0 0 0 3px rgba(31,156,93,.14)}
  .dot.bad{background:var(--bad);box-shadow:0 0 0 3px rgba(197,51,58,.14)}
  .dot.live{background:var(--live);box-shadow:0 0 0 3px rgba(212,69,63,.16);animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot.live{animation:none}}

  /* ---------- body ---------- */
  main{flex:1 1 auto;width:100%;max-width:1060px;margin:0 auto;padding:1.5rem 1.1rem 2.5rem}

  /* ---------- summary ---------- */
  .tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:1.6rem}
  .tile{
    position:relative;overflow:hidden;padding:.85rem 1rem .9rem;border-radius:8px;
    background:var(--panel);border:1px solid var(--line);box-shadow:var(--shadow);
  }
  .tile::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--tone,var(--line2))}
  .tile em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;
    text-transform:uppercase;color:var(--mut);margin-bottom:.4rem}
  .tile b{display:block;font-family:var(--mono);font-size:28px;font-weight:600;line-height:1;
    color:var(--fg);font-variant-numeric:tabular-nums}
  .tile .sub{margin-top:.4rem;font-size:11.5px;color:var(--mut)}
  .tile.hot{--tone:var(--live)}
  .tile.hot b{color:var(--live)}
  .tile.on{--tone:var(--ok)}

  /* ---------- section head ---------- */
  .sec{display:flex;align-items:baseline;gap:.6rem;margin:0 0 .6rem;padding:0 .15rem}
  .sec h2{margin:0;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.15em;
    text-transform:uppercase;color:var(--fg2)}
  .sec .hint{font-size:11px;color:var(--mut)}
  .sec .right{margin-left:auto;font-family:var(--mono);font-size:10px;color:var(--mut)}

  /* ---------- channel matrix ---------- */
  .matrix{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);
    box-shadow:var(--shadow);margin-bottom:1.7rem}
  .mrow{
    /* every track is fixed: each row is its own grid, so an auto track would size to that
       row's own content and the header would stop lining up with the rows beneath it */
    display:grid;grid-template-columns:3px 52px minmax(0,1fr) 100px 136px 118px 200px;
    align-items:center;gap:.85rem;padding:.72rem .9rem .72rem 0;border-bottom:1px solid var(--line);
  }
  .mrow:last-child{border-bottom:0}
  .mhead{background:var(--sunk);padding-top:.45rem;padding-bottom:.45rem}
  .mhead span{font-family:var(--mono);font-size:9.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--mut)}
  .mrow:not(.mhead):hover{background:var(--panel2)}
  .stripe{align-self:stretch;background:var(--tone,transparent)}

  .cbadge{
    font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.06em;
    color:var(--tone,var(--fg2));border:1px solid color-mix(in srgb, var(--tone,#d1d9e5) 45%, transparent);
    border-radius:3px;padding:.18rem 0;text-align:center;
    background:color-mix(in srgb, var(--tone,#d1d9e5) 9%, transparent);
  }
  .cname{font-size:13.5px;color:var(--fg);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cstate{display:flex;align-items:center;gap:.42rem;font-family:var(--mono);font-size:10px;
    letter-spacing:.09em;color:var(--mut)}
  .cstate.live{color:var(--live)}
  .cstate.ready{color:var(--ok)}
  .cstate.standby{color:#9a6a1c}
  .ccount{font-family:var(--mono);font-size:10.5px;color:var(--mut);font-variant-numeric:tabular-nums}
  .ccount b{color:var(--fg2);font-weight:600}

  /* activity strip - one tick per poll, newest at the right */
  .spark{display:flex;align-items:flex-end;gap:1px;height:18px}
  .spark i{flex:1 1 auto;border-radius:1px;background:#e7ebf2;height:4px}
  .spark i.s1{height:9px;background:#c3ccda}
  .spark i.s2{height:18px;background:var(--live)}

  .cact{display:flex;align-items:center;gap:.4rem;justify-content:flex-end}
  .abtn{
    display:inline-flex;align-items:center;gap:.4rem;text-decoration:none;cursor:pointer;
    padding:.42rem .72rem;border-radius:5px;font-size:12px;font-weight:600;white-space:nowrap;
    background:var(--panel);border:1px solid var(--line2);color:var(--fg2);
  }
  .abtn:hover{background:var(--sunk);border-color:#b6c1d2;color:var(--fg)}
  .abtn:active{background:#e6ebf3}
  .abtn.pri:hover{border-color:var(--steel);color:var(--steel)}
  .iconbtn{
    display:flex;align-items:center;justify-content:center;width:30px;height:28px;flex:0 0 auto;cursor:pointer;
    background:var(--panel);border:1px solid var(--line2);border-radius:5px;color:var(--fg2);padding:0;
  }
  .iconbtn:hover{background:var(--sunk);border-color:#b6c1d2;color:var(--fg)}
  .iconbtn svg{width:13px;height:13px;display:block}

  .empty{padding:1.1rem .9rem;color:var(--mut);font-size:12px}

  /* ---------- session ---------- */
  .info{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:0;
    border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);box-shadow:var(--shadow)}
  .kv{padding:.72rem .9rem;border-right:1px solid var(--line)}
  .kv:last-child{border-right:0}
  .kv em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--mut);margin-bottom:.3rem}
  .kv b{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--fg2);font-variant-numeric:tabular-nums}

  footer{max-width:1060px;margin:0 auto;padding:0 1.1rem 2rem;color:var(--mut);font-size:11.5px;line-height:1.7}
  footer code{font-family:var(--mono);background:var(--sunk);border:1px solid var(--line);
    border-radius:3px;padding:.06rem .3rem;color:var(--fg2)}

  .toast{
    position:fixed;left:50%;bottom:22px;transform:translateX(-50%);z-index:50;
    background:#131924;border:1px solid #131924;border-radius:5px;
    padding:.45rem .8rem;font-family:var(--mono);font-size:11px;color:#fff;
    opacity:0;pointer-events:none;transition:opacity .15s;
  }
  .toast.on{opacity:1}

  @media (max-width:860px){
    .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
    .tile b{font-size:22px}
    .info{grid-template-columns:repeat(2,minmax(0,1fr))}
    .kv{border-bottom:1px solid var(--line)}
    .mrow{grid-template-columns:3px 48px minmax(0,1fr);row-gap:.5rem;padding-right:.8rem}
    .mhead{display:none}
    .cstate,.ccount,.spark{grid-column:3}
    .cact{grid-column:2/-1;justify-content:flex-start;flex-wrap:wrap}
    .health{display:none}
  }
</style>
</head>
<body>

<div class="sysbar">
  <div class="sysbar-l">
    <img class="brandlogo" alt="KISWE">
    <span class="vr"></span>
    <span class="wordmark">prj-livesub</span>
    <span class="adminmark">admin</span>
  </div>
  <div class="sysbar-r">
    <div class="health">
      <span class="hx"><i class="dot" id="dot"></i><em>server</em><b id="hServer">확인 중</b></span>
      <span class="hx"><em>latency</em><b id="hLatency">—</b></span>
      <span class="hx"><em>uptime</em><b id="hUptime">—</b></span>
    </div>
  </div>
</div>

<main>
  <div class="tiles">
    <div class="tile" id="tOnair"><em>on air</em><b>0</b><span class="sub">송출 중인 채널</span></div>
    <div class="tile" id="tTypists"><em>typists</em><b>0</b><span class="sub">접속한 속기사</span></div>
    <div class="tile" id="tOutputs"><em>outputs</em><b>0</b><span class="sub">송출 화면</span></div>
  </div>

  <div class="sec">
    <h2>채널</h2>
    <span class="hint">활동 막대는 최근 2분, 오른쪽이 현재</span>
    <span class="right" id="chCount"></span>
  </div>
  <div class="matrix" id="matrix">
    <div class="empty">채널 정보를 불러오는 중…</div>
  </div>

  <div class="sec"><h2>설정</h2></div>
  <div class="info" id="info"></div>
</main>

<footer>
  각 행의 링크 아이콘은 스위처 Web source용 투명 배경(<code>bgMode=transparent</code>) URL을 복사합니다.
  자막 모양을 바꾸려면 송출 화면 우상단 설정에서 조정한 뒤 그 화면의 <code>URL 복사</code>를 쓰세요.
</footer>

<div class="toast" id="toast"></div>

<script src="/common/brand.js"></script>
<script src="/common/auth.js"></script>
<script>
(function () {
  const TICKS = 40;                 // 40 polls x 3s = the last two minutes
  const $ = (id) => document.getElementById(id);

  let cfg = null;
  let status = null;
  const hist = {};                  // code -> [0 idle, 1 staffed, 2 on air]

  const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const tone = (code) => 'var(--c-' + (['ko', 'en', 'ja', 'zh'].indexOf(code) >= 0 ? code : 'xx') + ')';

  // This page is for whoever runs the show. Typists are handed a typist URL directly and
  // never come through here, so there is no name field: they set their own on their screen.
  function links(code) {
    const pw = SubAuth.token();
    const q = (extra) => '?lang=' + encodeURIComponent(code)
      + (pw ? '&pw=' + encodeURIComponent(pw) : '') + (extra || '');
    return {
      typist: '/typist' + q(''),
      output: '/broadcast' + q(''),
      // the switcher takes the page as a web source; transparent is the production path
      source: location.origin + '/broadcast' + q('&bgMode=transparent'),
    };
  }

  // ---------- clipboard ----------
  let toastT = null;
  function toast(msg) {
    const el = $('toast');
    el.textContent = msg;
    el.classList.add('on');
    clearTimeout(toastT);
    toastT = setTimeout(() => el.classList.remove('on'), 1600);
  }
  function copy(text, msg) {
    const done = () => toast(msg);
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(text).then(done, () => fallback(text, done));
    } else {
      fallback(text, done);
    }
  }
  // plain http on a LAN is not a secure context, so the async clipboard is often unavailable
  function fallback(text, done) {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;top:-1000px;opacity:0';
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand('copy'); done(); } catch (e) { toast('복사 실패 — 수동으로 선택하세요'); }
    ta.remove();
  }

  // ---------- health ----------
  function setHealth(online, ms) {
    $('dot').className = 'dot ' + (online ? 'ok' : 'bad');
    $('hServer').textContent = online ? '정상' : '끊김';
    $('hLatency').textContent = online && ms != null ? ms + ' ms' : '—';
  }
  function hhmmss(ms) {
    const s = Math.max(0, Math.floor(ms / 1000));
    const p = (n) => String(n).padStart(2, '0');
    return p(Math.floor(s / 3600)) + ':' + p(Math.floor(s / 60) % 60) + ':' + p(s % 60);
  }

  // ---------- state ----------
  function levelOf(s) {
    if (!s) return 0;
    if (s.onair) return 2;
    if (s.typists > 0 || s.outputs > 0) return 1;
    return 0;
  }
  function stateOf(s) {
    if (!s) return { cls: '', dot: '', label: 'IDLE' };
    if (s.onair) return { cls: 'live', dot: 'live', label: 'ON AIR' };
    if (s.outputs > 0 && s.typists > 0) return { cls: 'ready', dot: 'ok', label: 'READY' };
    if (s.outputs > 0 || s.typists > 0) return { cls: 'standby', dot: '', label: 'STANDBY' };
    return { cls: '', dot: '', label: 'IDLE' };
  }

  function sparkHtml(code) {
    const h = hist[code] || [];
    let out = '<span class="spark">';
    for (let i = 0; i < TICKS; i++) {
      const v = h[h.length - TICKS + i];
      out += '<i class="' + (v === 2 ? 's2' : v === 1 ? 's1' : '') + '"></i>';
    }
    return out + '</span>';
  }

  function renderTiles() {
    const langs = (cfg && cfg.languages) || [];
    let onair = 0, typists = 0, outputs = 0;
    langs.forEach((l) => {
      const s = status && status.langs && status.langs[l.code];
      if (!s) return;
      if (s.onair) onair += 1;
      typists += s.typists;
      outputs += s.outputs;
    });
    const set = (id, val, cls) => {
      const el = $(id);
      el.querySelector('b').textContent = val;
      el.className = 'tile' + (cls ? ' ' + cls : '');
    };
    set('tOnair', onair, onair ? 'hot' : '');
    set('tTypists', typists, typists ? 'on' : '');
    set('tOutputs', outputs, outputs ? 'on' : '');
  }

  function renderMatrix() {
    if (!cfg) return;
    const langs = cfg.languages || [];
    $('chCount').textContent = langs.length + ' CH';

    let html = '<div class="mrow mhead"><span></span><span>ch</span><span>언어</span>'
      + '<span>상태</span><span>접속</span><span>활동</span><span></span></div>';

    langs.forEach((l) => {
      const s = (status && status.langs && status.langs[l.code]) || null;
      const st = stateOf(s);
      const c = s || { typists: 0, outputs: 0 };
      const lk = links(l.code);
      const t = tone(l.code);
      html += '<div class="mrow" style="--tone:' + t + '">'
        + '<span class="stripe" style="--tone:' + (st.label === 'IDLE' ? 'transparent' : t) + '"></span>'
        + '<span class="cbadge">' + esc(l.code.toUpperCase()) + '</span>'
        + '<span class="cname">' + esc(l.name) + '</span>'
        + '<span class="cstate ' + st.cls + '"><i class="dot ' + st.dot + '"></i>' + st.label + '</span>'
        + '<span class="ccount">속기 <b>' + c.typists + '</b> · 송출 <b>' + c.outputs + '</b></span>'
        + sparkHtml(l.code)
        + '<span class="cact">'
        +   '<a class="abtn pri" target="_blank" rel="noopener" href="' + lk.typist + '">타이피스트</a>'
        +   '<a class="abtn" target="_blank" rel="noopener" href="' + lk.output + '">송출</a>'
        +   '<button class="iconbtn" type="button" data-src="' + esc(lk.source) + '" '
        +     'title="스위처 Web source용 투명 배경 URL 복사" aria-label="송출 URL 복사">'
        +     '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">'
        +     '<path d="M6.6 9.4a2.6 2.6 0 0 0 3.9.3l2-2a2.6 2.6 0 0 0-3.7-3.7l-1.1 1.1"/>'
        +     '<path d="M9.4 6.6a2.6 2.6 0 0 0-3.9-.3l-2 2a2.6 2.6 0 0 0 3.7 3.7l1.1-1.1"/>'
        +     '</svg></button>'
        + '</span>'
        + '</div>';
    });

    const box = $('matrix');
    box.innerHTML = html;
    box.querySelectorAll('button[data-src]').forEach((b) => {
      b.addEventListener('click', () => copy(b.dataset.src, '송출 URL을 복사했습니다'));
    });
  }

  function renderInfo() {
    if (!cfg) return;
    const room = cfg.room || {};
    const rows = [
      ['default delay', ((room.defaultDelayMs || 0) / 1000).toFixed(1) + ' s'],
      ['max delay', ((room.maxDelayMs || 0) / 1000).toFixed(1) + ' s'],
      ['buffer', (room.bufferSize || 0) + ' lines'],
      ['password', cfg.authRequired ? 'ON' : 'OFF'],
      ['video source', (cfg.video && cfg.video.url) ? '연결됨' : '미설정'],
    ];
    $('info').innerHTML = rows
      .map(([k, v]) => '<div class="kv"><em>' + k + '</em><b>' + esc(v) + '</b></div>')
      .join('');
  }

  // ---------- poll ----------
  async function poll() {
    const t0 = performance.now();
    try {
      const r = await fetch('/api/status', { cache: 'no-store' });
      const ms = Math.round(performance.now() - t0);
      status = await r.json();
      setHealth(true, ms);
      $('hUptime').textContent = hhmmss(status.uptimeMs || 0);
      (cfg.languages || []).forEach((l) => {
        const arr = hist[l.code] || (hist[l.code] = []);
        arr.push(levelOf(status.langs && status.langs[l.code]));
        if (arr.length > TICKS) arr.shift();
      });
    } catch (e) {
      setHealth(false, null);
    }
    renderTiles();
    renderMatrix();
  }

  SubAuth.ensure({ title: 'prj-livesub', note: '계속하려면 비밀번호를 입력하세요.' })
    .then(() => fetch('/api/config'))
    .then((r) => r.json())
    .then((c) => {
      cfg = c;
      renderTiles();
      renderMatrix();
      renderInfo();
      poll();
      setInterval(poll, 3000);
    })
    .catch(() => {
      $('matrix').innerHTML = '<div class="empty">설정을 불러오지 못했습니다. 서버 콘솔을 확인하세요.</div>';
      setHealth(false, null);
    });
})();
</script>
</body>
</html>
